name: R31 Native KiCad Placement

on:
  push:
    branches:
      - engineering/r31-assembly-overlap-audit
    paths:
      - "hardware/mainboard/kicad/enku-mainboard-r0.8-base-assembly-placement.kicad_pcb"
      - "hardware/mainboard/kicad/*.kicad_sch"
      - "hardware/mainboard/kicad/check_r29_epd_power.py"
      - "hardware/mainboard/kicad/check_r30_service_pads.py"
      - "hardware/mainboard/kicad/check_r31_assembly_pad_clearance.py"
      - "hardware/mainboard/kicad/audit_r29_fp_pad_geometry.py"
      - ".github/workflows/native-base-mechanical.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-base:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:8.0
      options: --user 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: KiCad version
        run: kicad-cli version
      - name: Initialize native global KiCad footprint table
        run: |
          echo "KiCad home: $HOME"
          find /usr/share/kicad -maxdepth 3 -name fp-lib-table -print || true
          mkdir -p "$HOME/.config/kicad/8.0"
          if [ -f /usr/share/kicad/template/fp-lib-table ]; then
            cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/8.0/fp-lib-table"
            echo "Installed factory library table"
          else
            echo "No factory footprint library template; native mismatch details may be environment-related"
          fi

      - name: Check GDEY EPD module supplies and R28 0R
        run: python3 hardware/mainboard/kicad/check_r29_epd_power.py
      - name: Check R31 solder-pad placement and USB pin map
        run: python3 hardware/mainboard/kicad/check_r31_assembly_pad_clearance.py
      - name: Check R30 service pad geometry
        run: python3 hardware/mainboard/kicad/check_r30_service_pads.py
      - name: Attach R30 Base PCB to root KiCad schematic in temporary CI copy
        run: |
          cp hardware/mainboard/kicad/enku-mainboard-r0.8-base-assembly-placement.kicad_pcb hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pcb
      - name: Audit actual pad geometry against installed footprint libraries
        run: python3 hardware/mainboard/kicad/audit_r29_fp_pad_geometry.py
      - name: Native schematic ERC diagnostic (report, not approval)
        run: |
          kicad-cli sch erc --severity-all --output /tmp/r29-erc.rpt hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_sch || true
          test -s /tmp/r29-erc.rpt
          grep -E '^\[[^]]+\]:' /tmp/r29-erc.rpt | sort | uniq -c || true
      - name: Native PCB DRC and schematic parity diagnostic (unrouted)
        run: |
          kicad-cli pcb drc --severity-all --all-track-errors --schematic-parity --format json --output /tmp/r29-drc.json hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pcb || true
          test -s /tmp/r29-drc.json
          python3 - <<'PY'
          import collections,json
          d=json.load(open("/tmp/r29-drc.json"))
          print("R29 NATIVE DIAGNOSTICS - NO ROUTING; NOT A FABRICATION PASS")
          for k in ("violations","schematic_parity","unconnected_items","footprint_errors"):
              data=d.get(k,[])
              print(k,len(data))
              for n,count in sorted(collections.Counter(x.get("type","unknown") for x in data).items()): print(" ",n,count)
              if k=="schematic_parity":
                  for z in data[:25]: print("PARITY:",z.get("type"),z.get("description"))
              if k=="violations":
                  for issue_type in ("lib_footprint_mismatch","lib_footprint_issues","silk_edge_clearance"):
                      examples=[x for x in data if x.get("type")==issue_type][:4]
                      for x in examples: print("AUDIT_DETAIL:",issue_type,x.get("description"),x.get("items"))
                  for z in data:
                      if z.get("type") in ("copper_edge_clearance","board_edge","clearance","shorting_items","hole_clearance","tracks_crossing"):
                          print("CRITICAL_LAYOUT:",z.get("type"),z.get("description"),z.get("items"))
          critical=[x for x in d.get("violations",[]) if x.get("type") in
                    ("shorting_items","copper_edge_clearance","board_edge","clearance",
                     "hole_clearance","tracks_crossing")]
          if critical:
              raise SystemExit("Placement CRITICAL: "+str(len(critical))+" copper/edge/short violations")
          print("PLACEMENT CRITICAL GATE PASS: no native shorts or copper edge faults; DRC NOT PASS")
          PY
      - name: Preserve diagnostic reports (not Gerbers)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-r31-native-diagnostics
          path: |
            /tmp/r29-erc.rpt
            /tmp/r29-drc.json
            /tmp/r29-footprint-pad-audit.json
          if-no-files-found: warn
