name: R41 Native KiCad microSD Card Completion

on:
  push:
    branches:
      - engineering/r41-sd-card-completion
    paths:
      - "hardware/mainboard/kicad/enku-mainboard-r1.8-base-sd-card-completion.kicad_pcb"
      - "hardware/mainboard/kicad/*.kicad_sch"
      - "hardware/mainboard/kicad/check_r29_epd_power.py"
      - "hardware/mainboard/kicad/check_r30_service_pads.py"
      - "hardware/mainboard/kicad/check_r31_assembly_pad_clearance.py"
      - "hardware/mainboard/kicad/check_r32_jst_battery.py"
      - "hardware/mainboard/kicad/check_r33_power_domains.py"
      - "hardware/mainboard/kicad/check_r33_assembly.py"
      - "hardware/mainboard/kicad/check_r34_battery_gate.py"
      - "hardware/mainboard/kicad/check_r34_assembly.py"
      - "hardware/mainboard/kicad/check_r35_load_switch.py"
      - "hardware/mainboard/kicad/check_r35_assembly.py"
      - "hardware/mainboard/kicad/check_r36_power_copper.py"
      - "hardware/mainboard/kicad/check_r36_assembly.py"
      - "hardware/mainboard/kicad/check_r37_power_rails.py"
      - "hardware/mainboard/kicad/check_r37_assembly.py"
      - "hardware/mainboard/kicad/check_r38_ground_return.py"
      - "hardware/mainboard/kicad/check_r38_assembly.py"
      - "hardware/mainboard/kicad/check_r39_usb_msc.py"
      - "hardware/mainboard/kicad/check_r39_assembly.py"
      - "hardware/mainboard/kicad/check_r40_sd_fanout.py"
      - "hardware/mainboard/kicad/check_r40_assembly.py"
      - "hardware/mainboard/kicad/check_r41_assembly.py"
      - "hardware/mainboard/kicad/check_r41_vbus.py"
      - "hardware/mainboard/kicad/ENKU.kicad_sym"
      - "hardware/mainboard/kicad/ENKU.pretty/**"
      - "hardware/mainboard/kicad/check_r41_sd_connectivity.py"
      - "hardware/mainboard/kicad/check_r39_usb_msc.py"
      - "hardware/mainboard/kicad/check_r39_assembly.py"
      - "hardware/mainboard/kicad/refill_r38_zone.py"
      - "hardware/mainboard/kicad/audit_r29_fp_pad_geometry.py"
      - ".github/workflows/native-base-mechanical.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-base:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:8.0
      options: --user 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: KiCad version
        run: kicad-cli version
      - name: Initialize native global KiCad footprint table
        run: |
          echo "KiCad home: $HOME"
          find /usr/share/kicad -maxdepth 3 -name fp-lib-table -print || true
          mkdir -p "$HOME/.config/kicad/8.0"
          if [ -f /usr/share/kicad/template/fp-lib-table ]; then
            cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/8.0/fp-lib-table"
            echo "Installed factory library table"
          else
            echo "No factory footprint library template; native mismatch details may be environment-related"
          fi

      - name: Check GDEY EPD module supplies and R28 0R
        run: python3 hardware/mainboard/kicad/check_r29_epd_power.py
      - name: R39 USB-C and microSD Mass Storage hardware registration
        run: python3 hardware/mainboard/kicad/check_r39_usb_msc.py
      - name: R39 first microSD VDD/GND routed clearance audit
        run: python3 hardware/mainboard/kicad/check_r39_assembly.py
      - name: R41 fail-safe VBUS source and corner calculation
        run: python3 hardware/mainboard/kicad/check_r41_vbus.py
      - name: R41 active board assembly geometry
        run: python3 hardware/mainboard/kicad/check_r41_assembly.py
      - name: R41 active board SD connected components and USB pin map
        run: python3 hardware/mainboard/kicad/check_r41_sd_connectivity.py
      - name: R40 microSD VDD/SCLK/MOSI fanout, USB MSC hardware invariants
        run: python3 hardware/mainboard/kicad/check_r40_sd_fanout.py
      - name: R40 no-pad collision on 63 segments and 20 vias
        run: python3 hardware/mainboard/kicad/check_r40_assembly.py
      - name: R39 USB Type-C SD-MSC pinning and card rail
        run: python3 hardware/mainboard/kicad/check_r39_usb_msc.py
      - name: R39 first card 3V3 track and GND vias placement audit
        run: python3 hardware/mainboard/kicad/check_r39_assembly.py
      - name: R38 local In2 ground return zone and via guard
        run: python3 hardware/mainboard/kicad/check_r38_ground_return.py
      - name: R38 all pad and via clearance on ground return board
        run: python3 hardware/mainboard/kicad/check_r38_assembly.py
      - name: R37 charger SYS and output 3V3 power rail trace guard
        run: python3 hardware/mainboard/kicad/check_r37_power_rails.py
      - name: R37 all pads clearance on new routed board
        run: python3 hardware/mainboard/kicad/check_r37_assembly.py
      - name: R36 first copper route source and power-domain trace guard
        run: python3 hardware/mainboard/kicad/check_r36_power_copper.py
      - name: R36 all 125 pads and first-copper stage
        run: python3 hardware/mainboard/kicad/check_r36_assembly.py
      - name: R35 complete PMOS local-load-switch and 24pin EPD gate
        run: python3 hardware/mainboard/kicad/check_r35_load_switch.py
      - name: R35 manufacturer orientation and all-pad clearance
        run: python3 hardware/mainboard/kicad/check_r35_assembly.py
      - name: R34 always-on battery ADC switch and EPD 24-pin gate
        run: python3 hardware/mainboard/kicad/check_r34_battery_gate.py
      - name: R34 whole-board 123-component assembly overlaps
        run: python3 hardware/mainboard/kicad/check_r34_assembly.py
      - name: R33 switched supply and panel pin gate
        run: python3 hardware/mainboard/kicad/check_r33_power_domains.py
      - name: R33 whole-board SMT pad collision gate
        run: python3 hardware/mainboard/kicad/check_r33_assembly.py
      - name: R32 JST PH assembly pad and clearance gate
        run: python3 hardware/mainboard/kicad/check_r32_jst_battery.py
      - name: Check R31 solder-pad placement and USB pin map
        run: python3 hardware/mainboard/kicad/check_r31_assembly_pad_clearance.py
      - name: Check R30 service pad geometry
        run: python3 hardware/mainboard/kicad/check_r30_service_pads.py
      - name: Attach R30 Base PCB to root KiCad schematic in temporary CI copy
        run: |
          cp hardware/mainboard/kicad/enku-mainboard-r1.8-base-sd-card-completion.kicad_pcb hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pcb
      - name: Audit actual pad geometry against installed footprint libraries
        run: python3 hardware/mainboard/kicad/audit_r29_fp_pad_geometry.py
      - name: Native schematic ERC release gate (zero errors and warnings)
        run: |
          kicad-cli sch erc --severity-all --output /tmp/r29-erc.rpt hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_sch || true
          test -s /tmp/r29-erc.rpt
          grep -E '^\[[^]]+\]:' /tmp/r29-erc.rpt | sort | uniq -c || true
          echo 'R34 ERC report details (diagnostic, not fabrication pass):'
          sed -n '1,160p' /tmp/r29-erc.rpt
          echo '---- R35 native ERC report is displayed above; release gate follows ----'
          grep -q '\*\* ERC messages: 0  Errors 0  Warnings 0' /tmp/r29-erc.rpt
      - name: KiCad 8 fill both R41 ground references and verify saved polygons
        run: python3 hardware/mainboard/kicad/refill_r38_zone.py hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pcb /tmp/r38-refilled-diagnostic.kicad_pcb
      - name: Native PCB DRC and schematic parity diagnostic (unrouted)
        run: |
          kicad-cli pcb drc --severity-all --all-track-errors --schematic-parity --format json --output /tmp/r29-drc.json hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pcb || true
          test -s /tmp/r29-drc.json
          python3 - <<'PY'
          import collections,json
          d=json.load(open("/tmp/r29-drc.json"))
          print("R41 NATIVE DIAGNOSTICS - PARTIAL ROUTING; NOT A FABRICATION PASS")
          for k in ("violations","schematic_parity","unconnected_items","footprint_errors"):
              data=d.get(k,[])
              print(k,len(data))
              for n,count in sorted(collections.Counter(x.get("type","unknown") for x in data).items()): print(" ",n,count)
              if k=="schematic_parity":
                  for z in data[:25]: print("PARITY:",z.get("type"),z.get("description"))
              if k=="violations":
                  for issue_type in ("track_dangling","via_dangling","lib_footprint_mismatch","lib_footprint_issues","silk_edge_clearance"):
                      examples=[x for x in data if x.get("type")==issue_type][:4]
                      for x in examples: print("AUDIT_DETAIL:",issue_type,x.get("description"),x.get("items"))
                  for z in data:
                      if z.get("type") in ("copper_edge_clearance","board_edge","clearance","shorting_items","solder_mask_bridge","hole_clearance","tracks_crossing","track_dangling","via_dangling"):
                          print("CRITICAL_LAYOUT:",z.get("type"),z.get("description"),z.get("items"))
          critical=[x for x in d.get("violations",[]) if x.get("type") in
                    ("shorting_items","solder_mask_bridge","copper_edge_clearance","board_edge","clearance",
                     "hole_clearance","tracks_crossing","track_dangling","via_dangling")]
          if d.get("schematic_parity"):
              raise SystemExit("R41 schematic↔PCB parity failure: "+str(len(d["schematic_parity"])))
          if critical:
              raise SystemExit("Placement CRITICAL: "+str(len(critical))+" shorts / solder mask bridges / copper-edge violations")
          print("PLACEMENT CRITICAL GATE PASS: no native shorts or copper edge faults; DRC NOT PASS")
          PY
      - name: Retain exact diagnostic report bytes in logs for repository archiving
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,gzip,base64
          for name in ("r29-erc.rpt","r29-drc.json","r29-footprint-pad-audit.json"):
              p=pathlib.Path("/tmp")/name
              if p.exists():
                  print("R41_REPORT_GZIP_BASE64",name,base64.b64encode(gzip.compress(p.read_bytes(),mtime=0)).decode())
          PY
      - name: Preserve diagnostic reports (not Gerbers)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-r41-native-diagnostics
          path: |
            /tmp/r29-erc.rpt
            /tmp/r29-drc.json
            /tmp/r29-footprint-pad-audit.json
            /tmp/r38-refilled-diagnostic.kicad_pcb
          if-no-files-found: warn
