name: Hardware Zone Fill Artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "hardware/mainboard/kicad/**.kicad_pcb"
      - "hardware/mainboard/kicad/**.kicad_dru"
      - ".github/workflows/zone-fill.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fill-zones:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:8.0
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - name: Fill copper zones with KiCad
        run: |
          python3 - <<'PY'
          import pcbnew
          src="hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pcb"
          out="/tmp/enku-mainboard-r0.1-filled.kicad_pcb"
          board=pcbnew.LoadBoard(src)
          filler=pcbnew.ZONE_FILLER(board)
          filler.Fill(board.Zones())
          pcbnew.SaveBoard(out, board)
          print("filled_zones=", board.GetAreaCount())
          PY
      - name: Verify filled board with project rules
        run: |
          target="hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pcb"
          cp /tmp/enku-mainboard-r0.1-filled.kicad_pcb "$target"
          kicad-cli pcb drc --severity-all --schematic-parity --all-track-errors --output /tmp/filled-drc.rpt "$target"
          cat /tmp/filled-drc.rpt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enku-r01-filled-board
          path: |
            /tmp/enku-mainboard-r0.1-filled.kicad_pcb
            /tmp/filled-drc.rpt
