name: R142 Actual Source and Independent Review
on:
  push:
    branches: [engineering/r142-startup-independent-review]
    paths:
      - .github/workflows/r142-independent-review.yml
      - hardware/mainboard/r142/kicad/**
      - hardware/mainboard/r142/checks/**
      - hardware/mainboard/r142/source_manifest_R142.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r142-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ENKU_KICAD_APP: ${{ github.workspace }}/.native-runtime/AppDir/AppRun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .native-runtime/kicad.tar
          key: kicad-10.0.7-3c6067b03e2e6eb7b3e17f63f6d57c2937a19c39d585edd0c0a8d0bebaec8969
      - name: Install exact verified runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglu1-mesa libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 python3-venv
          python3 -m venv .audit-runtime
          .audit-runtime/bin/pip install --quiet shapely==2.2.0 numpy==2.3.5 gerbonara==1.6.3 scipy==1.16.3 matplotlib==3.10.8
          mkdir -p .native-runtime r142-verification
          cd .native-runtime
          if ! echo '3c6067b03e2e6eb7b3e17f63f6d57c2937a19c39d585edd0c0a8d0bebaec8969  kicad.tar' | sha256sum -c -; then
            curl -L --fail --retry 2 --connect-timeout 20 --max-time 900 -o kicad.tar https://mirrors.mit.edu/kicad/appimage/stable/kicad-10.0.7-x86_64-lite.AppImage.tar
          fi
          echo '3c6067b03e2e6eb7b3e17f63f6d57c2937a19c39d585edd0c0a8d0bebaec8969  kicad.tar' | sha256sum -c -
          tar -xf kicad.tar
          chmod +x kicad-10.0.7-x86_64-lite.AppImage
          ./kicad-10.0.7-x86_64-lite.AppImage --appimage-extract > extract.log
          test "$(./AppDir/AppRun kicad-cli version)" = 10.0.7
      - name: Verify retained canonical source and all effective negative cases
        run: |
          .audit-runtime/bin/python hardware/mainboard/kicad/checks/run_native_current.py hardware/mainboard/kicad r142-verification/baseline
          .audit-runtime/bin/python hardware/mainboard/kicad/checks/test_release_guards_R138.py hardware/mainboard/kicad r142-verification/baseline
      - name: Verify exact R142 source in isolated temporary directory
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,os,shutil
          from pathlib import Path
          src=Path('hardware/mainboard/r142/kicad')
          manifest=json.loads(Path('hardware/mainboard/r142/source_manifest_R142.json').read_text())
          assert not manifest['fabrication_ready']
          assert set(manifest['files'])=={p.relative_to(src).as_posix()for p in src.rglob('*')if p.is_file()}
          for name,meta in manifest['files'].items():
              p=src/name
              assert p.stat().st_size==meta['bytes'] and hashlib.sha256(p.read_bytes()).hexdigest()==meta['sha256']
          dest=Path(os.environ['RUNNER_TEMP'])/'r142-actual-source'
          shutil.copytree(src,dest)
          shutil.copytree('hardware/mainboard/kicad/checks',dest/'checks')
          shutil.copytree('hardware/mainboard/r142/checks',dest/'checks',dirs_exist_ok=True)
          PYTHON
          .audit-runtime/bin/python "$RUNNER_TEMP/r142-actual-source/checks/verify_candidate_R142.py" "$RUNNER_TEMP/r142-actual-source" r142-verification/candidate hardware/mainboard/kicad hardware/mainboard/r141/kicad
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r142-actual-verification-${{ github.sha }}
          path: r142-verification/
          retention-days: 30
