name: Native KiCad Current Engineering Check
on:
  workflow_dispatch:
  push:
    branches: [main, engineering/r136-capacitance-release]
    paths:
      - hardware/mainboard/**
      - .github/workflows/kicad-native.yml
      - docs/WORK_HANDOFF_R136.md
      - docs/CAPACITANCE_R136.md
  pull_request:
    branches: [main]
    paths:
      - hardware/mainboard/**
      - .github/workflows/kicad-native.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: current-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kicad-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      R136_TASK_GH_TOKEN: ${{ github.token }}
      KIPRJMOD: ${{ github.workspace }}/hardware/mainboard/kicad
    steps:
      - uses: actions/checkout@v4
      - name: Install SHA-pinned KiCad10.0.7 and exact audit runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglu1-mesa libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 python3-venv
          python3 -m venv .audit-runtime
          .audit-runtime/bin/pip install --quiet shapely==2.2.0 numpy==2.3.5
          mkdir -p .native-runtime native-results
          cd .native-runtime
          curl -L --fail --retry 2 --connect-timeout 20 --max-time 300 -o kicad.tar https://mirrors.mit.edu/kicad/appimage/stable/kicad-10.0.7-x86_64-lite.AppImage.tar
          echo '3c6067b03e2e6eb7b3e17f63f6d57c2937a19c39d585edd0c0a8d0bebaec8969  kicad.tar' | sha256sum -c -
          tar -xf kicad.tar
          chmod +x kicad-10.0.7-x86_64-lite.AppImage
          ./kicad-10.0.7-x86_64-lite.AppImage --appimage-extract > extract.log
          test "$(./AppDir/AppRun kicad-cli version)" = 10.0.7
      - name: Record actual run identity on isolated evidence branch
        if: github.event_name != 'pull_request'
        run: .audit-runtime/bin/python hardware/mainboard/kicad/checks/ci_evidence_R136.py
      - name: Verify immutable current source with full native checks and23 scopes
        run: .audit-runtime/bin/python hardware/mainboard/kicad/checks/run_native_current.py hardware/mainboard/kicad native-results
      - name: Check rejection of stale source baselines and component/geometry regressions
        run: .audit-runtime/bin/python hardware/mainboard/kicad/checks/test_release_guards_R136.py hardware/mainboard/kicad native-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enku-native-kicad-${{ github.sha }}
          path: native-results/
          retention-days: 30
