name: Native KiCad 10.0.7 Source Check

# R132: voltage-TS BQ24072T, thin-battery supply register, strict R130 preservation; fixed case; NO FAB.
on:
  workflow_dispatch:
  push:
    branches: [engineering/r119-recovery-checkpoint, engineering/r120-routing-closure, engineering/bat-rev3-external-ntc, engineering/r132-battery-supply-charge]
    paths: [.github/workflows/kicad-native.yml]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kicad-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KIPRJMOD: ${{ github.workspace }}/hardware/mainboard/kicad
    steps:
      - uses: actions/checkout@v4
      - name: Install exact official KiCad runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglu1-mesa libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 python3-shapely
          mkdir -p .native-runtime native-results
          cd .native-runtime
          curl -L --fail --retry 2 --connect-timeout 20 --max-time 300 -o kicad.tar https://mirrors.mit.edu/kicad/appimage/stable/kicad-10.0.7-x86_64-lite.AppImage.tar
          echo '3c6067b03e2e6eb7b3e17f63f6d57c2937a19c39d585edd0c0a8d0bebaec8969  kicad.tar' | sha256sum -c -
          tar -xf kicad.tar
          chmod +x kicad-10.0.7-x86_64-lite.AppImage
          ./kicad-10.0.7-x86_64-lite.AppImage --appimage-extract > extract.log
          ./AppDir/AppRun kicad-cli version | tee ../native-results/version.txt
          test "$(cat ../native-results/version.txt)" = 10.0.7
      - name: Preserve source identity
        run: |
          sha256sum hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pcb > native-results/source_pcb.sha256
          cp hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pro native-results/source.kicad_pro
      - name: Full native DRC with zone refill and schematic parity
        run: |
          .native-runtime/AppDir/AppRun kicad-cli pcb drc --severity-all --all-track-errors --schematic-parity --refill-zones --save-board --format json --output native-results/drc.json hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pcb
          .native-runtime/AppDir/AppRun python3.11 hardware/mainboard/kicad/checks/native_board.py export hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pcb native-results/geometry.json
      - name: Full native schematic ERC and netlist
        run: |
          .native-runtime/AppDir/AppRun kicad-cli sch erc --severity-all --format json --output native-results/erc.json hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_sch
          .native-runtime/AppDir/AppRun kicad-cli sch export netlist --format kicadxml --output native-results/netlist.xml hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_sch
      - name: Audit actual USB reference, component lands, paste and preserved source
        run: |
          .native-runtime/AppDir/AppRun python3.11 hardware/mainboard/kicad/checks/export_reference_planes.py hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pcb native-results/reference_planes_active.json.gz
          python3 hardware/mainboard/kicad/checks/audit_usb.py hardware/mainboard/kicad native-results
          python3 hardware/mainboard/kicad/checks/audit_geometry.py hardware/mainboard/kicad native-results
          python3 hardware/mainboard/kicad/checks/audit_q1_pin_order_R132.py hardware/mainboard/kicad native-results
          python3 hardware/mainboard/kicad/checks/audit_manufacturer_footprints.py hardware/mainboard/kicad native-results
          python3 hardware/mainboard/kicad/checks/audit_sw1_pin_map.py hardware/mainboard/kicad native-results
          .native-runtime/AppDir/AppRun python3.11 hardware/mainboard/kicad/checks/export_assembly_features.py hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pcb native-results/assembly_features.json
          .native-runtime/AppDir/AppRun python3.11 hardware/mainboard/kicad/checks/export_orientation_R130.py hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pcb native-results/orientation.json
          .native-runtime/AppDir/AppRun kicad-cli pcb export pos --format csv --units mm --side both --smd-only --exclude-dnp --output native-results/CPL.csv hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pcb
          python3 hardware/mainboard/kicad/checks/audit_active_IC_R132.py hardware/mainboard/kicad native-results
          python3 hardware/mainboard/kicad/checks/audit_assembly_R132.py hardware/mainboard/kicad native-results
          python3 hardware/mainboard/kicad/checks/audit_component_lands_R130.py hardware/mainboard/kicad native-results
          python3 hardware/mainboard/kicad/checks/audit_component_pass_R132.py hardware/mainboard/kicad native-results
          python3 hardware/mainboard/kicad/checks/audit_power_budget_R132.py hardware/mainboard/kicad native-results
          python3 hardware/mainboard/kicad/checks/audit_U1_EP_grid_R130.py hardware/mainboard/kicad native-results
          .native-runtime/AppDir/AppRun kicad-cli pcb export svg --layers F.Mask --mode-single --page-size-mode 2 --exclude-drawing-sheet --drill-shape-opt 0 --output native-results/F_Mask.svg hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pcb
          .native-runtime/AppDir/AppRun kicad-cli pcb export svg --layers F.Paste --mode-single --page-size-mode 2 --exclude-drawing-sheet --drill-shape-opt 0 --output native-results/F_Paste.svg hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pcb
          .native-runtime/AppDir/AppRun kicad-cli pcb export svg --layers B.Mask --mode-single --page-size-mode 2 --exclude-drawing-sheet --drill-shape-opt 0 --output native-results/B_Mask.svg hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pcb
          python3 hardware/mainboard/kicad/checks/audit_U1_plot_R130.py hardware/mainboard/kicad native-results
          python3 hardware/mainboard/kicad/checks/audit_IC_stencil_R132.py hardware/mainboard/kicad native-results
          python3 hardware/mainboard/kicad/checks/audit_intrinsic_holes_R130.py hardware/mainboard/kicad native-results
          python3 hardware/mainboard/kicad/checks/audit_parts_R132.py hardware/mainboard/kicad native-results
          python3 hardware/mainboard/kicad/checks/audit_charge_R132.py hardware/mainboard/kicad native-results
          cp native-results/source.kicad_pro hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pro
          python3 hardware/mainboard/kicad/checks/check_source_preservation_R132.py hardware/mainboard/kicad native-results
      - name: Compare server geometry and checks to the committed checkpoint
        run: python3 hardware/mainboard/kicad/checks/verify_native_checkpoint.py hardware/mainboard/kicad native-results
      - name: Publish actual findings
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, os
          p=pathlib.Path('native-results/server_comparison.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              if not p.exists():
                  f.write('Native comparison did not complete. See the job logs and retained artifacts.\n')
              else:
                  d=json.loads(p.read_text())
                  f.write('# ENKU Base native checkpoint\n\n')
                  f.write('Server/local comparison: **MATCH**. KiCad 10.0.7.\n\n')
                  f.write(f"Unconnected: **{d['opens']}**. ERC: **{d['ERC']}**. Schematic parity: **{d['schematic_parity']}**.\n\n")
                  f.write('| DRC type | Count |\n| --- | ---: |\n')
                  for k,v in sorted(d['drc_types'].items()):f.write(f'| {k} | {v} |\n')
                  f.write('\nFabrication status: **'+('READY' if d['fabrication_ready'] else 'NO FAB')+'**. Passing the comparison does not waive fabrication violations.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enku-native-kicad-${{ github.sha }}
          path: native-results/
          retention-days: 30

