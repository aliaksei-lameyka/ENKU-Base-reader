name: Native KiCad Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "hardware/mainboard/kicad/**"
      - ".github/workflows/kicad-native.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kicad-native:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:8.0
      options: --user 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: KiCad version
        run: kicad-cli version

      - name: Native schematic ERC report
        run: |
          kicad-cli sch erc \
            --severity-all \
            --output /tmp/enku-r01-erc.rpt \
            hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_sch
          cat /tmp/enku-r01-erc.rpt

      - name: Native PCB DRC report + schematic parity
        run: |
          python3 - <<'PY'
          import pcbnew
          path="hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pcb"
          board=pcbnew.LoadBoard(path)
          pcbnew.ZONE_FILLER(board).Fill(board.Zones())
          pcbnew.SaveBoard(path, board)
          print("refilled_zones=", board.GetAreaCount())
          PY
          kicad-cli pcb drc \
            --severity-all \
            --schematic-parity \
            --all-track-errors \
            --output /tmp/enku-r01-drc.rpt \
            hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pcb
          kicad-cli pcb drc \
            --format json \
            --severity-all \
            --schematic-parity \
            --all-track-errors \
            --output /tmp/enku-r01-drc.json \
            hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pcb
          cat /tmp/enku-r01-drc.rpt

      - name: Summarize routing closure
        run: |
          python3 - <<'PY'
          import collections, pathlib, re
          pcb = pathlib.Path("hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_pcb").read_text()
          drc = pathlib.Path("/tmp/enku-r01-drc.rpt").read_text()
          print("segments=", pcb.count("(segment "))
          print("vias=", pcb.count("(via "))
          blocks = re.findall(r"^\[unconnected_items\]:.*?(?=^\[|\\Z)", drc, re.M | re.S)
          # KiCad 8 can emit a self-referential GND-zone connectivity artifact after
          # refill: the same zone is listed twice at the same coordinate with no
          # pad/track/via endpoint. This is not a ratsnest item and must not block
          # routing closure. Keep every real endpoint-to-endpoint disconnect gated.
          real_blocks = []
          ignored_self_zone = []
          for block in blocks:
              endpoints = [ln.strip() for ln in block.splitlines() if "@(" in ln]
              only_zones = endpoints and all("Zone [" in ln for ln in endpoints)
              if only_zones and len(set(endpoints)) == 1:
                  ignored_self_zone.append(block)
              else:
                  real_blocks.append(block)
          unconnected = len(real_blocks)
          print("unconnected_items=", unconnected)
          print("ignored_self_zone_artifacts=", len(ignored_self_zone))
          by_net = collections.Counter()
          for block in real_blocks:
              for line in block.splitlines():
                  if " of " in line or "Track [" in line or "Via [" in line:
                      left = line.find("[")
                      right = line.find("]", left + 1)
                      if left >= 0 and right > left:
                          by_net[line[left + 1:right]] += 1
                          break
          print("unconnected_by_net:")
          for name, count in by_net.most_common():
              print(f"  {name}: {count}")
          if unconnected:
              raise SystemExit(f"Routing closure failed: {unconnected} unconnected item(s) remain")
          print("clearance_items=", len(re.findall(r"^\[clearance\]:", drc, re.M)))
          print("shorting_items=", len(re.findall(r"^\[shorting_items\]:", drc, re.M)))
          PY

      - name: Summarize schematic parity
        run: |
          python3 - <<'PY'
          import collections, json, pathlib
          report = json.loads(pathlib.Path("/tmp/enku-r01-drc.json").read_text())
          parity = report.get("schematic_parity", [])
          counts = collections.Counter(item.get("type", "unknown") for item in parity)
          print("schematic_parity_total=", len(parity))
          for kind, count in sorted(counts.items()):
              print(f"parity_{kind}={count}")
          print("\nParity details:")
          for item in parity:
              print(f"- {item.get('type', 'unknown')}: {item.get('description', '')}")
          PY

      - name: Gate first-spin critical violations
        run: |
          failed=0

          if grep -E '^\[(pin_to_pin|power_pin_not_driven|lib_symbol_issues|pin_not_connected|label_dangling|global_label_dangling)\]:' /tmp/enku-r01-erc.rpt; then
            echo "Critical schematic ERC violation detected."
            failed=1
          fi

          if grep -E '^\[(shorting_items|clearance|hole_clearance|board_edge|copper_edge_clearance|tracks_crossing)\]:' /tmp/enku-r01-drc.rpt; then
            echo "Critical PCB copper/clearance violation detected."
            failed=1
          fi

          exit "$failed"

      - name: Validate native schematic export
        run: |
          kicad-cli sch export netlist \
            --output /tmp/enku-r01.net \
            hardware/mainboard/kicad/enku-mainboard-r0.1.kicad_sch 2>&1 | tee /tmp/enku-r01-netlist.log
          test -s /tmp/enku-r01.net
          if grep -q "annotation errors" /tmp/enku-r01-netlist.log; then
            echo "KiCad reports schematic annotation errors."
            exit 1
          fi
          components="$(grep -Ec '\(comp \(ref |<comp ref=' /tmp/enku-r01.net || true)"
          echo "Netlist components: $components"
          if [ "$components" -lt 100 ]; then
            echo "Native schematic netlist unexpectedly contains fewer than 100 components."
            head -80 /tmp/enku-r01.net
            exit 1
          fi

      - name: Preserve KiCad reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enku-r01-kicad-reports
          path: |
            /tmp/enku-r01-erc.rpt
            /tmp/enku-r01-drc.rpt
            /tmp/enku-r01-drc.json
            /tmp/enku-r01.net
            /tmp/enku-r01-netlist.log
          if-no-files-found: warn
