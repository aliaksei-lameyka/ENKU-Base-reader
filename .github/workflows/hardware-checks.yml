name: R41 Active Base Hardware Checks

on:
  workflow_dispatch:
  push:
    paths:
      - "hardware/mainboard/kicad/**.kicad_sch"
      - "hardware/mainboard/kicad/**.kicad_pro"
      - "hardware/mainboard/kicad/**.kicad_pcb"
      - "hardware/mainboard/tools/mechanical_release_audit.py"
      - "hardware/mainboard/tools/check_component_manifest.py"
      - "hardware/mainboard/procurement/**"
      - "hardware/mainboard/kicad/check_*.py"
      - "hardware/mainboard/kicad/ENKU.pretty/**"
      - ".github/workflows/hardware-checks.yml"
  pull_request:
    paths:
      - "hardware/mainboard/kicad/**.kicad_sch"
      - "hardware/mainboard/kicad/**.kicad_pro"
      - "hardware/mainboard/kicad/**.kicad_pcb"
      - "hardware/mainboard/tools/mechanical_release_audit.py"
      - "hardware/mainboard/tools/check_component_manifest.py"
      - "hardware/mainboard/procurement/**"
      - "hardware/mainboard/kicad/check_*.py"
      - "hardware/mainboard/kicad/ENKU.pretty/**"
      - ".github/workflows/hardware-checks.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schematic-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate ENKU R0.1 schematics
        run: python hardware/mainboard/kicad/check_schematics.py

      - name: Verify J7 Tag-Connect manufacturer pad and guide-hole blockers
        run: python hardware/mainboard/kicad/check_r29_tagconnect.py

      - name: R39 USB Mass Storage hardware contract and card VDD pilot
        run: python hardware/mainboard/kicad/check_r39_usb_msc.py
      - name: R39 all-pad checks on first SD rail
        run: python hardware/mainboard/kicad/check_r39_assembly.py

      - name: R41 active PCB supplier register integrity (not qualification)
        run: python hardware/mainboard/tools/check_component_manifest.py --pcb hardware/mainboard/kicad/enku-mainboard-r1.8-base-sd-card-completion.kicad_pcb --manifest hardware/mainboard/procurement/COMPONENT_AUDIT_R41.csv
      - name: R41 active PCB mechanical blockers (diagnostic, not release)
        run: python hardware/mainboard/tools/mechanical_release_audit.py --pcb hardware/mainboard/kicad/enku-mainboard-r1.8-base-sd-card-completion.kicad_pcb
      - name: R41 fail-safe VBUS source and corner calculation
        run: python3 hardware/mainboard/kicad/check_r41_vbus.py
      - name: R41 active board assembly geometry
        run: python3 hardware/mainboard/kicad/check_r41_assembly.py
      - name: R41 active board SD connected components and USB pin map
        run: python3 hardware/mainboard/kicad/check_r41_sd_connectivity.py
      - name: R40 microSD SPI fanout and native USB MSC readiness guard
        run: python hardware/mainboard/kicad/check_r40_sd_fanout.py
      - name: R40 collision gate on updated multi-layer card traces
        run: python hardware/mainboard/kicad/check_r40_assembly.py

      - name: R39 native USB MSC and SD4 hardware contract
        run: python hardware/mainboard/kicad/check_r39_usb_msc.py
      - name: R39 card 3V3 routing physical clearance
        run: python hardware/mainboard/kicad/check_r39_assembly.py

      - name: R38 ground return island/via topology
        run: python hardware/mainboard/kicad/check_r38_ground_return.py
      - name: R38 physical pad clearance with GND pilot
        run: python hardware/mainboard/kicad/check_r38_assembly.py

      - name: R37 charge-path and 3V3 output source rail guard
        run: python hardware/mainboard/kicad/check_r37_power_rails.py
      - name: R37 all pads assembly geometry with via/copper
        run: python hardware/mainboard/kicad/check_r37_assembly.py

      - name: R36 local first-copper route and via guard
        run: python hardware/mainboard/kicad/check_r36_power_copper.py
      - name: R36 SMT clearance with routed board active
        run: python hardware/mainboard/kicad/check_r36_assembly.py

      - name: R35 local PMOS power-domain source gate
        run: python hardware/mainboard/kicad/check_r35_load_switch.py
      - name: R35 complete SMT-pad overlap and manufacturer pin order gate
        run: python hardware/mainboard/kicad/check_r35_assembly.py

      - name: Check R32 JST PH and full-board pad clearance
        run: python hardware/mainboard/kicad/check_r32_jst_battery.py

      - name: Check R31 solder-pad placement and USB pin map
        run: python hardware/mainboard/kicad/check_r31_assembly_pad_clearance.py

      - name: Check R30 Tag-Connect and exposed dock pad geometry
        run: python hardware/mainboard/kicad/check_r30_service_pads.py

      - name: Check R29 physical courtyard overlaps, edge mouths, mounting clearance
        run: python hardware/mainboard/kicad/check_r29_courtyard.py

      - name: Validate R28 dedicated Base excludes Hall and Qi
        run: python hardware/mainboard/kicad/check_r28_base_variant.py

      - name: Validate R27 manufacturer-stepped FPC flat trace
        run: python hardware/mainboard/kicad/check_r27_stepped_fpc_flat.py

      - name: Verify experimental R26 FPC connector and relocated M2 design
        run: python hardware/mainboard/kicad/check_r26_fpc_trial.py

      - name: Verify exact GDEY0397T81P FPC/J3 registration blockers
        run: python hardware/mainboard/kicad/check_r25_fpc_registration.py

      - name: Validate R25 mounting drills and case-opening interface
        run: python hardware/mainboard/kicad/check_r25_mounting_drills.py

      - name: Check R25 blank placement-only PCB against baseline
        run: python hardware/mainboard/kicad/check_r25_placement_canvas.py

      - name: Validate ENKU R0.1 PCB placement
        run: python hardware/mainboard/kicad/check_pcb_placement.py

      - name: Audit physical placements and release blockers
        run: python hardware/mainboard/tools/mechanical_release_audit.py

      - name: Validate G-Switch four-pin EVAL land pattern
        run: python hardware/mainboard/kicad/check_gswitch_eval.py

      - name: Audit component sourcing, footprint identity, position and rotation
        run: python hardware/mainboard/tools/check_component_manifest.py

      - name: Validate ENKU R0.1 footprint consistency
        run: python hardware/mainboard/kicad/check_footprint_consistency.py

      - name: Validate ENKU R28 dedicated Base PCB population
        run: python hardware/mainboard/kicad/check_pcb_population.py

      - name: Validate ENKU R0.1 silkscreen readability
        run: python hardware/mainboard/kicad/check_silkscreen.py
